name: Update dashboard

# Runs on GitHub's servers — no local machine required.
on:
  schedule:
    # 22:30 UTC every weekday — ~1.5-2.5h after the US market close (covers EDT & EST).
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mark NAV + rebuild dashboard
        run: python build_dashboard.py

      - name: Commit refreshed data + page
        run: |
          git config user.name "fortress-dashboard-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/paper_track.csv data/paper_state.json data/core_returns.csv data/target_book.json
          if git diff --staged --quiet; then
            echo "No new marks — nothing to commit."
          else
            git commit -m "Auto update: mark through $(date -u +%F)"
            git push
          fi
